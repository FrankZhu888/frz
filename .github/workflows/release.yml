name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build binaries
        run: |
          cd go
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME} -X main.buildTime=$(date +%Y-%m-%d)"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o frz-darwin-arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o frz-darwin-amd64 .
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o frz-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o frz-linux-arm64 .

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: go/frz-*
          generate_release_notes: true
